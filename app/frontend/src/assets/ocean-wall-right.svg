<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 800" preserveAspectRatio="none">
  <defs>
    <!-- craggy silhouette: a smooth outline pushed around by noise -->
    <filter id="rough" x="-15%" y="-5%" width="140%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022 0.009" numOctaves="4" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="64" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- the rock surface: noise used as a bump map and lit from the upper right, tinted deep blue -->
    <filter id="face" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.05" numOctaves="6" seed="14" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="9" diffuseConstant="1.25" lighting-color="#6cc4ff" result="lit">
        <feDistantLight azimuth="338" elevation="34"/>
      </feDiffuseLighting>
      <feColorMatrix in="lit" type="matrix" values="0.20 0 0 0 0   0 0.34 0 0 0.02   0 0 0.55 0 0.05   0 0 0 1 0"/>
    </filter>
    <linearGradient id="dark" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#021022" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#021022" stop-opacity="0"/>
      <stop offset="1" stop-color="#010812" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-5%" width="180%" height="110%"><feGaussianBlur stdDeviation="9"/></filter>
    <path id="outline" d="M-40 -40 H112 C150 60 92 150 136 240 S88 372 130 466 S100 632 140 726 S108 790 122 840 H-40 Z"/>
    <mask id="wall"><g transform="translate(300 0) scale(-1 1)"><g filter="url(#rough)"><use href="#outline" fill="#fff"/></g></g></mask>
  </defs>

  <!-- blue glow bleeding past the rock edge -->
  <g transform="translate(300 0) scale(-1 1)"><g filter="url(#rough)">
    <use href="#outline" fill="none" stroke="#0086ff" stroke-opacity="0.5" stroke-width="16" filter="url(#soft)"/>
  </g></g>

  <!-- rock face, clipped to the craggy silhouette -->
  <g mask="url(#wall)">
    <rect x="-40" y="-40" width="340" height="880" filter="url(#face)"/>
    <rect x="-40" y="-40" width="340" height="880" fill="url(#dark)"/>
    <rect x="-40" y="-40" width="340" height="880" fill="url(#depth)"/>
  </g>
</svg>
